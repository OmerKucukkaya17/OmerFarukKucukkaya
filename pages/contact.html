<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../scripts/myscript.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">TeknoMarket</div>
        <div class="menu-toggle" id="mobileMenu">☰</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html">Ana Sayfa</a></li>
            <li><a href="products.html">Ürünler</a></li>
            <li><a href="product-detail.html">Ürün Detayı</a></li>
            <li><a href="cart.html">Sepet</a></li>
            <li><a href="contact.html">İletişim</a></li>
        </ul>
    </nav>

    <main>
        <h2 style="margin-bottom: 20px;">Bizimle İletişime Geçin</h2>
        
        <!-- Form Yapısı -->
        <form onsubmit="alert('Mesajınız başarıyla gönderildi!'); return false;">
            <div class="form-group">
                <label for="name">Adınız Soyadınız:</label>
                <input type="text" id="name" required placeholder="Örn: Ahmet Yılmaz">
            </div>

            <div class="form-group">
                <label for="email">E-posta Adresiniz:</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="subject">Konu:</label>
                <input type="text" id="subject" required placeholder="Mesaj konusu">
            </div>

            <div class="form-group">
                <label for="message">Mesajınız:</label>
                <textarea id="message" rows="5" required placeholder="Mesajınızı buraya yazın..."></textarea>
            </div>

            <button type="submit" class="btn" style="background-color: #2c3e50;">Gönder</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 TeknoMarket - Tüm Hakları Saklıdır.</p>
    </footer>

</body>
</html>
